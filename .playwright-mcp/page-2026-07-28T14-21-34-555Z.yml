            - listitem [ref=f9e82]: АвтоКаско
          - heading "АвтоКаско" [level=1] [ref=f9e83]
          - generic [ref=f9e84]:
            - generic [ref=f9e85]:
              - generic [ref=f9e86]:
                - generic [ref=f9e87]: КАСКО
                - paragraph [ref=f9e88]: КАСКО — это полис добровольного страхования, который обеспечивает финансовую защиту при повреждении автомобиля и помогает избежать непредвиденных затрат на ремонт.
              - heading "Что покрывает:" [level=3] [ref=f9e89]
              - list [ref=f9e91]:
                - listitem [ref=f9e92]: — ДТП, в том числе в результате столкновения с животными;
                - listitem [ref=f9e93]: — наезд на неподвижные предметы;
                - listitem [ref=f9e94]: — противоправные действия третьих лиц;
                - listitem [ref=f9e95]: — пожар, взрыв, возгорание, в том числе электропроводки;
                - listitem [ref=f9e96]: — повреждения в результате стихийных бедствий и природных сил;
                - listitem [ref=f9e97]: — повреждения посторонними предметами, в том числе камнями из-под колес других автомобилей;
                - listitem [ref=f9e98]: — хищение или угон транспортного средства и другие риски.
              - heading "Варианты страхования:" [level=3] [ref=f9e99]
              - generic [ref=f9e100]:
                - generic [ref=f9e101]:
                  - generic [ref=f9e102]: Без учета износа
                  - paragraph [ref=f9e103]: Возмещение ущерба осуществляется без учета износа деталей, подлежащих замене.
                - generic [ref=f9e104]:
                  - generic [ref=f9e105]: Без учета износа по калькуляции
                  - paragraph [ref=f9e106]: Возмещение ущерба осуществляется без учета износа деталей, подлежащих замене.
                  - paragraph [ref=f9e107]: Расчет ущерба производится на основании калькуляции и заключения специалиста по оценке транспортных средств.
                - generic [ref=f9e108]:
                  - generic [ref=f9e109]: С учетом износа
                  - paragraph [ref=f9e110]: Расчет ущерба производится на основании калькуляции стоимости ремонта транспортного средства и заключения о размере вреда.
              - heading "Программа «Оптимальное КАСКО»" [level=3] [ref=f9e111]
              - generic [ref=f9e112]:
                - generic [ref=f9e113]: Специальные условия для автомобилей до 5 лет
                - paragraph [ref=f9e114]: Договор страхования для легковых автомобилей возрастом до 5 лет включительно может быть заключен по программе «Оптимальное КАСКО», в том числе для транспортных средств, приобретенных по договору лизинга либо за счет привлечения банковских средств.
                - generic [ref=f9e115]: Тарифы действуют при наличии и (или) одновременном заключении в ЗАСО «ТАСК» договора добровольного страхования гражданской ответственности владельцев транспортных средств сроком на 1 год.
              - table [ref=f9e117]:
                - rowgroup [ref=f9e118]:
                  - row [ref=f9e119]:
                    - columnheader "Страховая сумма" [ref=f9e120]
                    - columnheader "10 000–15 000 USD" [ref=f9e121]
                    - columnheader "15 000–20 000 USD" [ref=f9e122]
                    - columnheader "20 000–40 000 USD" [ref=f9e123]
                    - columnheader "40 000–60 000 USD" [ref=f9e124]
                    - columnheader "60 000–100 000 USD" [ref=f9e125]
                - rowgroup [ref=f9e126]:
                  - row [ref=f9e127]:
                    - cell "Автомобили до 3 лет" [ref=f9e128]
                    - cell "3,5%" [ref=f9e129]
                    - cell "2,9%" [ref=f9e130]
                    - cell "2,5%" [ref=f9e131]
                    - cell "2,3%" [ref=f9e132]
                    - cell "2,1%" [ref=f9e133]
                  - row [ref=f9e134]:
                    - cell "Автомобили от 4 до 5 лет" [ref=f9e135]
                    - cell "3,5%" [ref=f9e136]
                    - cell "3,2%" [ref=f9e137]
                    - cell "3,2%" [ref=f9e138]
                    - cell "2,8%" [ref=f9e139]
                    - cell "2,8%" [ref=f9e140]
              - generic [ref=f9e141]:
                - paragraph [ref=f9e142]: Для электромобилей и гибридных автомобилей страховой взнос не может быть менее 700 USD либо страховой тариф не может быть менее 3%.
                - paragraph [ref=f9e143]: Условия не распространяются на транспортные средства, используемые в качестве такси, по договорам проката или аренды, а также зарегистрированные за пределами Республики Беларусь.
              - heading "Преимущества полиса КАСКО от ЗАСО «ТАСК»" [level=3] [ref=f9e144]
              - generic [ref=f9e145]:
                - generic [ref=f9e146]:
                  - generic [ref=f9e147]: Гибкие условия
                  - list [ref=f9e148]:
                    - listitem [ref=f9e149]: — гибкие тарифы;
                    - listitem [ref=f9e150]: — бесплатная рассрочка платежа.
                - generic [ref=f9e151]:
                  - generic [ref=f9e152]: Мультидрайв
                  - paragraph [ref=f9e153]: Специальная опция, позволяющая управлять застрахованным автомобилем любому водителю.
                - generic [ref=f9e154]:
                  - generic [ref=f9e155]: Скидки при страховании
                  - list [ref=f9e156]:
                    - listitem [ref=f9e157]: — скидки при наличии договоров по другим видам страхования;
                    - listitem [ref=f9e158]: — скидки при проведении рекламных акций;
                    - listitem [ref=f9e159]: — скидки за безубыточное страхование.
              - heading "Когда можно не обращаться в компетентные органы" [level=3] [ref=f9e160]
              - generic [ref=f9e161]:
                - list [ref=f9e162]:
                  - listitem [ref=f9e163]: — при повреждении только деталей остекления кузова, зеркал и приборов внешнего освещения;
                  - listitem [ref=f9e164]: — при повреждении транспортного средства и (или) дополнительного оборудования, если размер ущерба не превышает 5% от страховой суммы.
                - generic [ref=f9e165]: Возможность применяется не более двух раз за срок действия договора страхования.
              - heading "Перечень необходимых документов" [level=3] [ref=f9e166]
              - list [ref=f9e168]:
                - listitem [ref=f9e169]: — письменное заявление на заключение договора страхования АвтоКАСКО;
                - listitem [ref=f9e170]: — паспорт или иное удостоверение личности;
                - listitem [ref=f9e171]: — регистрационные документы на транспортное средство;
                - listitem [ref=f9e172]: — предъявление транспортного средства представителю страховщика для осмотра.
