        - heading "АвтоКаско" [level=1] [ref=f11e112]
        - generic [ref=f11e113]:
          - generic [ref=f11e114]:
            - generic [ref=f11e115]:
              - generic [ref=f11e116]: КАСКО
              - paragraph [ref=f11e117]: КАСКО — это полис добровольного страхования, который обеспечивает финансовую защиту при повреждении автомобиля и помогает избежать непредвиденных затрат на ремонт.
            - heading "Что покрывает:" [level=3] [ref=f11e118]
            - list [ref=f11e120]:
              - listitem [ref=f11e121]: — ДТП, в том числе в результате столкновения с животными;
              - listitem [ref=f11e122]: — наезд на неподвижные предметы;
              - listitem [ref=f11e123]: — противоправные действия третьих лиц;
              - listitem [ref=f11e124]: — пожар, взрыв, возгорание, в том числе электропроводки;
              - listitem [ref=f11e125]: — повреждения в результате стихийных бедствий и природных сил;
              - listitem [ref=f11e126]: — повреждения посторонними предметами, в том числе камнями из-под колес других автомобилей;
              - listitem [ref=f11e127]: — хищение или угон транспортного средства и другие риски.
            - heading "Варианты страхования:" [level=3] [ref=f11e128]
            - generic [ref=f11e129]:
              - generic [ref=f11e130]:
                - generic [ref=f11e131]: Без учета износа
                - paragraph [ref=f11e132]: Возмещение ущерба осуществляется без учета износа деталей, подлежащих замене.
              - generic [ref=f11e133]:
                - generic [ref=f11e134]: Без учета износа по калькуляции
                - paragraph [ref=f11e135]: Возмещение ущерба осуществляется без учета износа деталей, подлежащих замене.
                - paragraph [ref=f11e136]: Расчет ущерба производится на основании калькуляции и заключения специалиста по оценке транспортных средств.
              - generic [ref=f11e137]:
                - generic [ref=f11e138]: С учетом износа
                - paragraph [ref=f11e139]: Расчет ущерба производится на основании калькуляции стоимости ремонта транспортного средства и заключения о размере вреда.
            - heading "Программа «Оптимальное КАСКО»" [level=3] [ref=f11e140]
            - generic [ref=f11e141]:
              - generic [ref=f11e142]: Специальные условия для автомобилей до 5 лет
              - paragraph [ref=f11e143]: Договор страхования для легковых автомобилей возрастом до 5 лет включительно может быть заключен по программе «Оптимальное КАСКО», в том числе для транспортных средств, приобретенных по договору лизинга либо за счет привлечения банковских средств.
              - generic [ref=f11e144]: Тарифы действуют при наличии и (или) одновременном заключении в ЗАСО «ТАСК» договора добровольного страхования гражданской ответственности владельцев транспортных средств сроком на 1 год.
            - table [ref=f11e146]:
              - rowgroup [ref=f11e147]:
                - row [ref=f11e148]:
                  - columnheader "Страховая сумма" [ref=f11e149]
                  - columnheader "10 000–15 000 USD" [ref=f11e150]
                  - columnheader "15 000–20 000 USD" [ref=f11e151]
                  - columnheader "20 000–40 000 USD" [ref=f11e152]
                  - columnheader "40 000–60 000 USD" [ref=f11e153]
                  - columnheader "60 000–100 000 USD" [ref=f11e154]
              - rowgroup [ref=f11e155]:
                - row [ref=f11e156]:
                  - cell "Автомобили до 3 лет" [ref=f11e157]
                  - cell "3,5%" [ref=f11e158]
                  - cell "2,9%" [ref=f11e159]
                  - cell "2,5%" [ref=f11e160]
                  - cell "2,3%" [ref=f11e161]
                  - cell "2,1%" [ref=f11e162]
                - row [ref=f11e163]:
                  - cell "Автомобили от 4 до 5 лет" [ref=f11e164]
                  - cell "3,5%" [ref=f11e165]
                  - cell "3,2%" [ref=f11e166]
                  - cell "3,2%" [ref=f11e167]
                  - cell "2,8%" [ref=f11e168]
                  - cell "2,8%" [ref=f11e169]
            - generic [ref=f11e170]:
              - paragraph [ref=f11e171]: Для электромобилей и гибридных автомобилей страховой взнос не может быть менее 700 USD либо страховой тариф не может быть менее 3%.
              - paragraph [ref=f11e172]: Условия не распространяются на транспортные средства, используемые в качестве такси, по договорам проката или аренды, а также зарегистрированные за пределами Республики Беларусь.
            - heading "Преимущества полиса КАСКО от ЗАСО «ТАСК»" [level=3] [ref=f11e173]
            - generic [ref=f11e174]:
              - generic [ref=f11e175]:
                - generic [ref=f11e176]: Гибкие условия
                - list [ref=f11e177]:
                  - listitem [ref=f11e178]: — гибкие тарифы;
                  - listitem [ref=f11e179]: — бесплатная рассрочка платежа.
              - generic [ref=f11e180]:
                - generic [ref=f11e181]: Мультидрайв
                - paragraph [ref=f11e182]: Специальная опция, позволяющая управлять застрахованным автомобилем любому водителю.
              - generic [ref=f11e183]:
                - generic [ref=f11e184]: Скидки при страховании
                - list [ref=f11e185]:
                  - listitem [ref=f11e186]: — скидки при наличии договоров по другим видам страхования;
                  - listitem [ref=f11e187]: — скидки при проведении рекламных акций;
                  - listitem [ref=f11e188]: — скидки за безубыточное страхование.
            - heading "Когда можно не обращаться в компетентные органы" [level=3] [ref=f11e189]
            - generic [ref=f11e190]:
              - list [ref=f11e191]:
                - listitem [ref=f11e192]: — при повреждении только деталей остекления кузова, зеркал и приборов внешнего освещения;
                - listitem [ref=f11e193]: — при повреждении транспортного средства и (или) дополнительного оборудования, если размер ущерба не превышает 5% от страховой суммы.
              - generic [ref=f11e194]: Возможность применяется не более двух раз за срок действия договора страхования.
            - heading "Перечень необходимых документов" [level=3] [ref=f11e195]
            - list [ref=f11e197]:
              - listitem [ref=f11e198]: — письменное заявление на заключение договора страхования АвтоКАСКО;
              - listitem [ref=f11e199]: — паспорт или иное удостоверение личности;
              - listitem [ref=f11e200]: — регистрационные документы на транспортное средство;
              - listitem [ref=f11e201]: — предъявление транспортного средства представителю страховщика для осмотра.
            - heading "Страховой случай" [level=3] [ref=f11e202]
            - generic [ref=f11e203]:
