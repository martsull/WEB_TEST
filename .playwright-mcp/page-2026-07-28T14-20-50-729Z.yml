            - listitem [ref=f7e82]: АвтоКаско
          - heading "АвтоКаско" [level=1] [ref=f7e83]
          - generic [ref=f7e84]:
            - generic [ref=f7e85]:
              - generic [ref=f7e86]:
                - generic [ref=f7e87]: КАСКО
                - paragraph [ref=f7e88]: КАСКО — это полис добровольного страхования, который обеспечивает финансовую защиту при повреждении автомобиля и помогает избежать непредвиденных затрат на ремонт.
              - heading "Что покрывает:" [level=3] [ref=f7e89]
              - list [ref=f7e91]:
                - listitem [ref=f7e92]: — ДТП, в том числе в результате столкновения с животными;
                - listitem [ref=f7e93]: — наезд на неподвижные предметы;
                - listitem [ref=f7e94]: — противоправные действия третьих лиц;
                - listitem [ref=f7e95]: — пожар, взрыв, возгорание, в том числе электропроводки;
                - listitem [ref=f7e96]: — повреждения в результате стихийных бедствий и природных сил;
                - listitem [ref=f7e97]: — повреждения посторонними предметами, в том числе камнями из-под колес других автомобилей;
                - listitem [ref=f7e98]: — хищение или угон транспортного средства и другие риски.
              - heading "Варианты страхования:" [level=3] [ref=f7e99]
              - generic [ref=f7e100]:
                - generic [ref=f7e101]:
                  - generic [ref=f7e102]: Без учета износа
                  - paragraph [ref=f7e103]: Возмещение ущерба осуществляется без учета износа деталей, подлежащих замене.
                - generic [ref=f7e104]:
                  - generic [ref=f7e105]: Без учета износа по калькуляции
                  - paragraph [ref=f7e106]: Возмещение ущерба осуществляется без учета износа деталей, подлежащих замене.
                  - paragraph [ref=f7e107]: Расчет ущерба производится на основании калькуляции и заключения специалиста по оценке транспортных средств.
                - generic [ref=f7e108]:
                  - generic [ref=f7e109]: С учетом износа
                  - paragraph [ref=f7e110]: Расчет ущерба производится на основании калькуляции стоимости ремонта транспортного средства и заключения о размере вреда.
              - heading "Программа «Оптимальное КАСКО»" [level=3] [ref=f7e111]
              - generic [ref=f7e112]:
                - generic [ref=f7e113]: Специальные условия для автомобилей до 5 лет
                - paragraph [ref=f7e114]: Договор страхования для легковых автомобилей возрастом до 5 лет включительно может быть заключен по программе «Оптимальное КАСКО», в том числе для транспортных средств, приобретенных по договору лизинга либо за счет привлечения банковских средств.
                - generic [ref=f7e115]: Тарифы действуют при наличии и (или) одновременном заключении в ЗАСО «ТАСК» договора добровольного страхования гражданской ответственности владельцев транспортных средств сроком на 1 год.
              - table [ref=f7e117]:
                - rowgroup [ref=f7e118]:
                  - row [ref=f7e119]:
                    - columnheader "Страховая сумма" [ref=f7e120]
                    - columnheader "10 000–15 000 USD" [ref=f7e121]
                    - columnheader "15 000–20 000 USD" [ref=f7e122]
                    - columnheader "20 000–40 000 USD" [ref=f7e123]
                    - columnheader "40 000–60 000 USD" [ref=f7e124]
                    - columnheader "60 000–100 000 USD" [ref=f7e125]
                - rowgroup [ref=f7e126]:
                  - row [ref=f7e127]:
                    - cell "Автомобили до 3 лет" [ref=f7e128]
                    - cell "3,5%" [ref=f7e129]
                    - cell "2,9%" [ref=f7e130]
                    - cell "2,5%" [ref=f7e131]
                    - cell "2,3%" [ref=f7e132]
                    - cell "2,1%" [ref=f7e133]
                  - row [ref=f7e134]:
                    - cell "Автомобили от 4 до 5 лет" [ref=f7e135]
                    - cell "3,5%" [ref=f7e136]
                    - cell "3,2%" [ref=f7e137]
                    - cell "3,2%" [ref=f7e138]
                    - cell "2,8%" [ref=f7e139]
                    - cell "2,8%" [ref=f7e140]
              - generic [ref=f7e141]:
                - paragraph [ref=f7e142]: Для электромобилей и гибридных автомобилей страховой взнос не может быть менее 700 USD либо страховой тариф не может быть менее 3%.
                - paragraph [ref=f7e143]: Условия не распространяются на транспортные средства, используемые в качестве такси, по договорам проката или аренды, а также зарегистрированные за пределами Республики Беларусь.
              - heading "Преимущества полиса КАСКО от ЗАСО «ТАСК»" [level=3] [ref=f7e144]
              - generic [ref=f7e145]:
                - generic [ref=f7e146]:
                  - generic [ref=f7e147]: Гибкие условия
                  - list [ref=f7e148]:
                    - listitem [ref=f7e149]: — гибкие тарифы;
                    - listitem [ref=f7e150]: — бесплатная рассрочка платежа.
                - generic [ref=f7e151]:
                  - generic [ref=f7e152]: Мультидрайв
                  - paragraph [ref=f7e153]: Специальная опция, позволяющая управлять застрахованным автомобилем любому водителю.
                - generic [ref=f7e154]:
                  - generic [ref=f7e155]: Скидки при страховании
                  - list [ref=f7e156]:
                    - listitem [ref=f7e157]: — скидки при наличии договоров по другим видам страхования;
                    - listitem [ref=f7e158]: — скидки при проведении рекламных акций;
                    - listitem [ref=f7e159]: — скидки за безубыточное страхование.
              - heading "Когда можно не обращаться в компетентные органы" [level=3] [ref=f7e160]
              - generic [ref=f7e161]:
                - list [ref=f7e162]:
                  - listitem [ref=f7e163]: — при повреждении только деталей остекления кузова, зеркал и приборов внешнего освещения;
                  - listitem [ref=f7e164]: — при повреждении транспортного средства и (или) дополнительного оборудования, если размер ущерба не превышает 5% от страховой суммы.
                - generic [ref=f7e165]: Возможность применяется не более двух раз за срок действия договора страхования.
              - heading "Перечень необходимых документов" [level=3] [ref=f7e166]
              - list [ref=f7e168]:
                - listitem [ref=f7e169]: — письменное заявление на заключение договора страхования АвтоКАСКО;
                - listitem [ref=f7e170]: — паспорт или иное удостоверение личности;
                - listitem [ref=f7e171]: — регистрационные документы на транспортное средство;
                - listitem [ref=f7e172]: — предъявление транспортного средства представителю страховщика для осмотра.
