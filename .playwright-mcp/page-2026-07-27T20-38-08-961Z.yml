        - heading "АвтоКаско" [level=1] [ref=f3e112]
        - generic [ref=f3e113]:
          - generic [ref=f3e114]:
            - generic [ref=f3e115]:
              - generic [ref=f3e116]: КАСКО
              - paragraph [ref=f3e117]: КАСКО — это полис добровольного страхования, который обеспечивает финансовую защиту при повреждении автомобиля и помогает избежать непредвиденных затрат на ремонт.
            - heading "Что покрывает:" [level=3] [ref=f3e118]
            - list [ref=f3e120]:
              - listitem [ref=f3e121]: — ДТП, в том числе в результате столкновения с животными;
              - listitem [ref=f3e122]: — наезд на неподвижные предметы;
              - listitem [ref=f3e123]: — противоправные действия третьих лиц;
              - listitem [ref=f3e124]: — пожар, взрыв, возгорание, в том числе электропроводки;
              - listitem [ref=f3e125]: — повреждения в результате стихийных бедствий и природных сил;
              - listitem [ref=f3e126]: — повреждения посторонними предметами, в том числе камнями из-под колес других автомобилей;
              - listitem [ref=f3e127]: — хищение или угон транспортного средства и другие риски.
            - heading "Варианты страхования:" [level=3] [ref=f3e128]
            - generic [ref=f3e129]:
              - generic [ref=f3e130]:
                - generic [ref=f3e131]: Без учета износа
                - paragraph [ref=f3e132]: Возмещение ущерба осуществляется без учета износа деталей, подлежащих замене.
              - generic [ref=f3e133]:
                - generic [ref=f3e134]: Без учета износа по калькуляции
                - paragraph [ref=f3e135]: Возмещение ущерба осуществляется без учета износа деталей, подлежащих замене.
                - paragraph [ref=f3e136]: Расчет ущерба производится на основании калькуляции и заключения специалиста по оценке транспортных средств.
              - generic [ref=f3e137]:
                - generic [ref=f3e138]: С учетом износа
                - paragraph [ref=f3e139]: Расчет ущерба производится на основании калькуляции стоимости ремонта транспортного средства и заключения о размере вреда.
            - heading "Программа «Оптимальное КАСКО»" [level=3] [ref=f3e140]
            - generic [ref=f3e141]:
              - generic [ref=f3e142]: Специальные условия для автомобилей до 5 лет
              - paragraph [ref=f3e143]: Договор страхования для легковых автомобилей возрастом до 5 лет включительно может быть заключен по программе «Оптимальное КАСКО», в том числе для транспортных средств, приобретенных по договору лизинга либо за счет привлечения банковских средств.
              - generic [ref=f3e144]: Тарифы действуют при наличии и (или) одновременном заключении в ЗАСО «ТАСК» договора добровольного страхования гражданской ответственности владельцев транспортных средств сроком на 1 год.
            - table [ref=f3e146]:
              - rowgroup [ref=f3e147]:
                - row [ref=f3e148]:
                  - columnheader "Страховая сумма" [ref=f3e149]
                  - columnheader "10 000–15 000 USD" [ref=f3e150]
                  - columnheader "15 000–20 000 USD" [ref=f3e151]
                  - columnheader "20 000–40 000 USD" [ref=f3e152]
                  - columnheader "40 000–60 000 USD" [ref=f3e153]
                  - columnheader "60 000–100 000 USD" [ref=f3e154]
              - rowgroup [ref=f3e155]:
                - row [ref=f3e156]:
                  - cell "Автомобили до 3 лет" [ref=f3e157]
                  - cell "3,5%" [ref=f3e158]
                  - cell "2,9%" [ref=f3e159]
                  - cell "2,5%" [ref=f3e160]
                  - cell "2,3%" [ref=f3e161]
                  - cell "2,1%" [ref=f3e162]
                - row [ref=f3e163]:
                  - cell "Автомобили от 4 до 5 лет" [ref=f3e164]
                  - cell "3,5%" [ref=f3e165]
                  - cell "3,2%" [ref=f3e166]
                  - cell "3,2%" [ref=f3e167]
                  - cell "2,8%" [ref=f3e168]
                  - cell "2,8%" [ref=f3e169]
            - generic [ref=f3e170]:
              - paragraph [ref=f3e171]: Для электромобилей и гибридных автомобилей страховой взнос не может быть менее 700 USD либо страховой тариф не может быть менее 3%.
              - paragraph [ref=f3e172]: Условия не распространяются на транспортные средства, используемые в качестве такси, по договорам проката или аренды, а также зарегистрированные за пределами Республики Беларусь.
            - heading "Преимущества полиса КАСКО от ЗАСО «ТАСК»" [level=3] [ref=f3e173]
            - generic [ref=f3e174]:
              - generic [ref=f3e175]:
                - generic [ref=f3e176]: Гибкие условия
                - list [ref=f3e177]:
                  - listitem [ref=f3e178]: — гибкие тарифы;
                  - listitem [ref=f3e179]: — бесплатная рассрочка платежа.
              - generic [ref=f3e180]:
                - generic [ref=f3e181]: Мультидрайв
                - paragraph [ref=f3e182]: Специальная опция, позволяющая управлять застрахованным автомобилем любому водителю.
              - generic [ref=f3e183]:
                - generic [ref=f3e184]: Скидки при страховании
                - list [ref=f3e185]:
                  - listitem [ref=f3e186]: — скидки при наличии договоров по другим видам страхования;
                  - listitem [ref=f3e187]: — скидки при проведении рекламных акций;
                  - listitem [ref=f3e188]: — скидки за безубыточное страхование.
            - heading "Когда можно не обращаться в компетентные органы" [level=3] [ref=f3e189]
            - generic [ref=f3e190]:
              - list [ref=f3e191]:
                - listitem [ref=f3e192]: — при повреждении только деталей остекления кузова, зеркал и приборов внешнего освещения;
                - listitem [ref=f3e193]: — при повреждении транспортного средства и (или) дополнительного оборудования, если размер ущерба не превышает 5% от страховой суммы.
              - generic [ref=f3e194]: Возможность применяется не более двух раз за срок действия договора страхования.
            - heading "Перечень необходимых документов" [level=3] [ref=f3e195]
            - list [ref=f3e197]:
              - listitem [ref=f3e198]: — письменное заявление на заключение договора страхования АвтоКАСКО;
              - listitem [ref=f3e199]: — паспорт или иное удостоверение личности;
              - listitem [ref=f3e200]: — регистрационные документы на транспортное средство;
              - listitem [ref=f3e201]: — предъявление транспортного средства представителю страховщика для осмотра.
            - heading "Страховой случай" [level=3] [ref=f3e202]
            - generic [ref=f3e203]:
