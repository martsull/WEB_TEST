  - main [ref=f15e51]:
    - generic [ref=f15e52]: UX/UI аудит сайта task.by
    - generic [ref=f15e53]: Комплексный аудит юзабилити, визуального дизайна, конверсии и доступности · Desktop 1440×900 + Mobile 390×844
    - generic [ref=f15e54]:
      - heading "Краткое резюме" [level=2] [ref=f15e55]
      - paragraph [ref=f15e56]: "Что за сайт. task.by — корпоративный сайт страховой компании ЗАСО «ТАСК», работающей на рынке с 1991 года. Сайт выполняет три функции: витрина продуктов страхования (для частных лиц и юрлиц), справочный/юридический портал (лицензии, реквизиты, раскрытие информации) и точка входа в онлайн-сервисы (личный кабинет, онлайн-страхование ОСГО, оплата через ЕРИП). Целевая аудитория — от частных автовладельцев, оформляющих ОСАГО/КАСКО, до корпоративных клиентов и государственных органов, то есть аудитория широкая и в среднем возрастная."
      - paragraph [ref=f15e57]: "Общее впечатление. Сайт функционален и содержит большой объём достоверной информации, но визуально и по логике взаимодействия соответствует стандартам веб-дизайна 2012–2015 годов, а не 2025–2026. Структура страниц шаблонная и предсказуема — это плюс для навигации, но исполнение (типографика, иллюстрации, компоновка) выглядит устаревшим. Главная проблема — не в отсутствии контента, а в отсутствии пути к конверсии: почти нигде на сайте нет кнопки «оформить полис» или «рассчитать стоимость»."
      - generic [ref=f15e58]:
        - text: "Сильные стороны:"
        - list [ref=f15e59]:
          - listitem [ref=f15e60]: Глубокая, предсказуемая иерархия разделов, одинаковая на всех страницах
          - listitem [ref=f15e61]: Большой объём достоверной юридической и справочной информации
          - listitem [ref=f15e62]: "Работающие онлайн-сервисы: личный кабинет, онлайн-ОСГО, оплата через ЕРИП"
          - listitem [ref=f15e63]: Понятная и рабочая форма авторизации
          - listitem [ref=f15e64]: Сеть из 11 региональных представительств с полными контактами
      - generic [ref=f15e65]:
        - text: "Слабые стороны:"
        - list [ref=f15e66]:
          - listitem [ref=f15e67]: Почти полное отсутствие CTA на продуктовых страницах
          - listitem [ref=f15e68]: Мобильная версия теряет номер телефона полностью
          - listitem [ref=f15e69]: Таблица тарифов КАСКО обрезается на мобильном без индикатора прокрутки
          - listitem [ref=f15e70]: «О компании» не формирует доверие — только юридические реквизиты
          - listitem [ref=f15e71]: Устаревший визуальный язык, смешение шрифтов, мелкий текст (14px)
          - listitem [ref=f15e72]: Системное дублирование блоков ссылок на уровне шаблона
      - paragraph [ref=f15e73]: Общий вывод. Сайт заслуживает оценки «крепкий справочный портал, но слабая продающая витрина». Рекомендуется не косметический редизайн, а пересмотр модели конверсии в сочетании с обновлением визуального языка и исправлением критических мобильных дефектов.
