        - generic [ref=f15e213]:
          - term [ref=f15e214]: Описание
          - definition [ref=f15e215]: Страница объёмом ~4000px содержит подробное описание продукта и полную тарифную таблицу. Единственный интерактивный элемент — кнопка «Страховой случай», ведущая на оформление уже наступившего страхового случая, а не на покупку нового полиса.
          - term [ref=f15e216]: Почему проблема
          - definition [ref=f15e217]: Пользователь, готовый купить полис после изучения тарифов, не находит ни одной кнопки «Купить» или «Рассчитать стоимость».
