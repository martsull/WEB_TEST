          - term [ref=f15e224]: Как исправить
          - definition [ref=f15e225]: Добавить sticky/контекстную кнопку «Рассчитать стоимость КАСКО» сразу после тарифов, ведущую на калькулятор или форму заявки.
          - term [ref=f15e226]: Ожидаемый эффект
