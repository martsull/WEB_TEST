            - listitem [ref=f23e82]: АвтоКаско
          - heading "АвтоКаско" [level=1] [ref=f23e83]
          - generic [ref=f23e84]:
            - generic [ref=f23e85]:
              - generic [ref=f23e86]:
                - generic [ref=f23e87]: КАСКО
                - paragraph [ref=f23e88]: КАСКО — это полис добровольного страхования, который обеспечивает финансовую защиту при повреждении автомобиля и помогает избежать непредвиденных затрат на ремонт.
              - heading "Что покрывает:" [level=3] [ref=f23e89]
              - list [ref=f23e91]:
                - listitem [ref=f23e92]: — ДТП, в том числе в результате столкновения с животными;
                - listitem [ref=f23e93]: — наезд на неподвижные предметы;
                - listitem [ref=f23e94]: — противоправные действия третьих лиц;
                - listitem [ref=f23e95]: — пожар, взрыв, возгорание, в том числе электропроводки;
                - listitem [ref=f23e96]: — повреждения в результате стихийных бедствий и природных сил;
                - listitem [ref=f23e97]: — повреждения посторонними предметами, в том числе камнями из-под колес других автомобилей;
                - listitem [ref=f23e98]: — хищение или угон транспортного средства и другие риски.
              - heading "Варианты страхования:" [level=3] [ref=f23e99]
              - generic [ref=f23e100]:
                - generic [ref=f23e101]:
                  - generic [ref=f23e102]: Без учета износа
                  - paragraph [ref=f23e103]: Возмещение ущерба осуществляется без учета износа деталей, подлежащих замене.
                - generic [ref=f23e104]:
                  - generic [ref=f23e105]: Без учета износа по калькуляции
                  - paragraph [ref=f23e106]: Возмещение ущерба осуществляется без учета износа деталей, подлежащих замене.
                  - paragraph [ref=f23e107]: Расчет ущерба производится на основании калькуляции и заключения специалиста по оценке транспортных средств.
                - generic [ref=f23e108]:
                  - generic [ref=f23e109]: С учетом износа
                  - paragraph [ref=f23e110]: Расчет ущерба производится на основании калькуляции стоимости ремонта транспортного средства и заключения о размере вреда.
              - heading "Программа «Оптимальное КАСКО»" [level=3] [ref=f23e111]
              - generic [ref=f23e112]:
                - generic [ref=f23e113]: Специальные условия для автомобилей до 5 лет
                - paragraph [ref=f23e114]: Договор страхования для легковых автомобилей возрастом до 5 лет включительно может быть заключен по программе «Оптимальное КАСКО», в том числе для транспортных средств, приобретенных по договору лизинга либо за счет привлечения банковских средств.
                - generic [ref=f23e115]: Тарифы действуют при наличии и (или) одновременном заключении в ЗАСО «ТАСК» договора добровольного страхования гражданской ответственности владельцев транспортных средств сроком на 1 год.
              - table [ref=f23e117]:
                - rowgroup [ref=f23e118]:
                  - row [ref=f23e119]:
                    - columnheader "Страховая сумма" [ref=f23e120]
                    - columnheader "10 000–15 000 USD" [ref=f23e121]
                    - columnheader "15 000–20 000 USD" [ref=f23e122]
                    - columnheader "20 000–40 000 USD" [ref=f23e123]
                    - columnheader "40 000–60 000 USD" [ref=f23e124]
                    - columnheader "60 000–100 000 USD" [ref=f23e125]
                - rowgroup [ref=f23e126]:
                  - row [ref=f23e127]:
                    - cell "Автомобили до 3 лет" [ref=f23e128]
                    - cell "3,5%" [ref=f23e129]
                    - cell "2,9%" [ref=f23e130]
                    - cell "2,5%" [ref=f23e131]
                    - cell "2,3%" [ref=f23e132]
                    - cell "2,1%" [ref=f23e133]
                  - row [ref=f23e134]:
                    - cell "Автомобили от 4 до 5 лет" [ref=f23e135]
                    - cell "3,5%" [ref=f23e136]
                    - cell "3,2%" [ref=f23e137]
                    - cell "3,2%" [ref=f23e138]
                    - cell "2,8%" [ref=f23e139]
                    - cell "2,8%" [ref=f23e140]
              - generic [ref=f23e141]:
                - paragraph [ref=f23e142]: Для электромобилей и гибридных автомобилей страховой взнос не может быть менее 700 USD либо страховой тариф не может быть менее 3%.
                - paragraph [ref=f23e143]: Условия не распространяются на транспортные средства, используемые в качестве такси, по договорам проката или аренды, а также зарегистрированные за пределами Республики Беларусь.
              - heading "Преимущества полиса КАСКО от ЗАСО «ТАСК»" [level=3] [ref=f23e144]
              - generic [ref=f23e145]:
                - generic [ref=f23e146]:
                  - generic [ref=f23e147]: Гибкие условия
                  - list [ref=f23e148]:
                    - listitem [ref=f23e149]: — гибкие тарифы;
                    - listitem [ref=f23e150]: — бесплатная рассрочка платежа.
                - generic [ref=f23e151]:
                  - generic [ref=f23e152]: Мультидрайв
                  - paragraph [ref=f23e153]: Специальная опция, позволяющая управлять застрахованным автомобилем любому водителю.
                - generic [ref=f23e154]:
                  - generic [ref=f23e155]: Скидки при страховании
                  - list [ref=f23e156]:
                    - listitem [ref=f23e157]: — скидки при наличии договоров по другим видам страхования;
                    - listitem [ref=f23e158]: — скидки при проведении рекламных акций;
                    - listitem [ref=f23e159]: — скидки за безубыточное страхование.
              - heading "Когда можно не обращаться в компетентные органы" [level=3] [ref=f23e160]
              - generic [ref=f23e161]:
                - list [ref=f23e162]:
                  - listitem [ref=f23e163]: — при повреждении только деталей остекления кузова, зеркал и приборов внешнего освещения;
                  - listitem [ref=f23e164]: — при повреждении транспортного средства и (или) дополнительного оборудования, если размер ущерба не превышает 5% от страховой суммы.
                - generic [ref=f23e165]: Возможность применяется не более двух раз за срок действия договора страхования.
              - heading "Перечень необходимых документов" [level=3] [ref=f23e166]
              - list [ref=f23e168]:
                - listitem [ref=f23e169]: — письменное заявление на заключение договора страхования АвтоКАСКО;
                - listitem [ref=f23e170]: — паспорт или иное удостоверение личности;
                - listitem [ref=f23e171]: — регистрационные документы на транспортное средство;
                - listitem [ref=f23e172]: — предъявление транспортного средства представителю страховщика для осмотра.
