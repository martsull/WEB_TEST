            - listitem [ref=f12e82]: АвтоКаско
          - heading "АвтоКаско" [level=1] [ref=f12e83]
          - generic [ref=f12e84]:
            - generic [ref=f12e85]:
              - generic [ref=f12e86]:
                - generic [ref=f12e87]: КАСКО
                - paragraph [ref=f12e88]: КАСКО — это полис добровольного страхования, который обеспечивает финансовую защиту при повреждении автомобиля и помогает избежать непредвиденных затрат на ремонт.
              - heading "Что покрывает:" [level=3] [ref=f12e89]
              - list [ref=f12e91]:
                - listitem [ref=f12e92]: — ДТП, в том числе в результате столкновения с животными;
                - listitem [ref=f12e93]: — наезд на неподвижные предметы;
                - listitem [ref=f12e94]: — противоправные действия третьих лиц;
                - listitem [ref=f12e95]: — пожар, взрыв, возгорание, в том числе электропроводки;
                - listitem [ref=f12e96]: — повреждения в результате стихийных бедствий и природных сил;
                - listitem [ref=f12e97]: — повреждения посторонними предметами, в том числе камнями из-под колес других автомобилей;
                - listitem [ref=f12e98]: — хищение или угон транспортного средства и другие риски.
              - heading "Варианты страхования:" [level=3] [ref=f12e99]
              - generic [ref=f12e100]:
                - generic [ref=f12e101]:
                  - generic [ref=f12e102]: Без учета износа
                  - paragraph [ref=f12e103]: Возмещение ущерба осуществляется без учета износа деталей, подлежащих замене.
                - generic [ref=f12e104]:
                  - generic [ref=f12e105]: Без учета износа по калькуляции
                  - paragraph [ref=f12e106]: Возмещение ущерба осуществляется без учета износа деталей, подлежащих замене.
                  - paragraph [ref=f12e107]: Расчет ущерба производится на основании калькуляции и заключения специалиста по оценке транспортных средств.
                - generic [ref=f12e108]:
                  - generic [ref=f12e109]: С учетом износа
                  - paragraph [ref=f12e110]: Расчет ущерба производится на основании калькуляции стоимости ремонта транспортного средства и заключения о размере вреда.
              - heading "Программа «Оптимальное КАСКО»" [level=3] [ref=f12e111]
              - generic [ref=f12e112]:
                - generic [ref=f12e113]: Специальные условия для автомобилей до 5 лет
                - paragraph [ref=f12e114]: Договор страхования для легковых автомобилей возрастом до 5 лет включительно может быть заключен по программе «Оптимальное КАСКО», в том числе для транспортных средств, приобретенных по договору лизинга либо за счет привлечения банковских средств.
                - generic [ref=f12e115]: Тарифы действуют при наличии и (или) одновременном заключении в ЗАСО «ТАСК» договора добровольного страхования гражданской ответственности владельцев транспортных средств сроком на 1 год.
              - table [ref=f12e117]:
                - rowgroup [ref=f12e118]:
                  - row [ref=f12e119]:
                    - columnheader "Страховая сумма" [ref=f12e120]
                    - columnheader "10 000–15 000 USD" [ref=f12e121]
                    - columnheader "15 000–20 000 USD" [ref=f12e122]
                    - columnheader "20 000–40 000 USD" [ref=f12e123]
                    - columnheader "40 000–60 000 USD" [ref=f12e124]
                    - columnheader "60 000–100 000 USD" [ref=f12e125]
                - rowgroup [ref=f12e126]:
                  - row [ref=f12e127]:
                    - cell "Автомобили до 3 лет" [ref=f12e128]
                    - cell "3,5%" [ref=f12e129]
                    - cell "2,9%" [ref=f12e130]
                    - cell "2,5%" [ref=f12e131]
                    - cell "2,3%" [ref=f12e132]
                    - cell "2,1%" [ref=f12e133]
                  - row [ref=f12e134]:
                    - cell "Автомобили от 4 до 5 лет" [ref=f12e135]
                    - cell "3,5%" [ref=f12e136]
                    - cell "3,2%" [ref=f12e137]
                    - cell "3,2%" [ref=f12e138]
                    - cell "2,8%" [ref=f12e139]
                    - cell "2,8%" [ref=f12e140]
              - generic [ref=f12e141]:
                - paragraph [ref=f12e142]: Для электромобилей и гибридных автомобилей страховой взнос не может быть менее 700 USD либо страховой тариф не может быть менее 3%.
                - paragraph [ref=f12e143]: Условия не распространяются на транспортные средства, используемые в качестве такси, по договорам проката или аренды, а также зарегистрированные за пределами Республики Беларусь.
              - heading "Преимущества полиса КАСКО от ЗАСО «ТАСК»" [level=3] [ref=f12e144]
              - generic [ref=f12e145]:
                - generic [ref=f12e146]:
                  - generic [ref=f12e147]: Гибкие условия
                  - list [ref=f12e148]:
                    - listitem [ref=f12e149]: — гибкие тарифы;
                    - listitem [ref=f12e150]: — бесплатная рассрочка платежа.
                - generic [ref=f12e151]:
                  - generic [ref=f12e152]: Мультидрайв
                  - paragraph [ref=f12e153]: Специальная опция, позволяющая управлять застрахованным автомобилем любому водителю.
                - generic [ref=f12e154]:
                  - generic [ref=f12e155]: Скидки при страховании
                  - list [ref=f12e156]:
                    - listitem [ref=f12e157]: — скидки при наличии договоров по другим видам страхования;
                    - listitem [ref=f12e158]: — скидки при проведении рекламных акций;
                    - listitem [ref=f12e159]: — скидки за безубыточное страхование.
              - heading "Когда можно не обращаться в компетентные органы" [level=3] [ref=f12e160]
              - generic [ref=f12e161]:
                - list [ref=f12e162]:
                  - listitem [ref=f12e163]: — при повреждении только деталей остекления кузова, зеркал и приборов внешнего освещения;
                  - listitem [ref=f12e164]: — при повреждении транспортного средства и (или) дополнительного оборудования, если размер ущерба не превышает 5% от страховой суммы.
                - generic [ref=f12e165]: Возможность применяется не более двух раз за срок действия договора страхования.
              - heading "Перечень необходимых документов" [level=3] [ref=f12e166]
              - list [ref=f12e168]:
                - listitem [ref=f12e169]: — письменное заявление на заключение договора страхования АвтоКАСКО;
                - listitem [ref=f12e170]: — паспорт или иное удостоверение личности;
                - listitem [ref=f12e171]: — регистрационные документы на транспортное средство;
                - listitem [ref=f12e172]: — предъявление транспортного средства представителю страховщика для осмотра.
