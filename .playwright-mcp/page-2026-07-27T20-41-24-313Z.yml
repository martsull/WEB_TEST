            - listitem [ref=f10e82]: АвтоКаско
          - heading "АвтоКаско" [level=1] [ref=f10e83]
          - generic [ref=f10e84]:
            - generic [ref=f10e85]:
              - generic [ref=f10e86]:
                - generic [ref=f10e87]: КАСКО
                - paragraph [ref=f10e88]: КАСКО — это полис добровольного страхования, который обеспечивает финансовую защиту при повреждении автомобиля и помогает избежать непредвиденных затрат на ремонт.
              - heading "Что покрывает:" [level=3] [ref=f10e89]
              - list [ref=f10e91]:
                - listitem [ref=f10e92]: — ДТП, в том числе в результате столкновения с животными;
                - listitem [ref=f10e93]: — наезд на неподвижные предметы;
                - listitem [ref=f10e94]: — противоправные действия третьих лиц;
                - listitem [ref=f10e95]: — пожар, взрыв, возгорание, в том числе электропроводки;
                - listitem [ref=f10e96]: — повреждения в результате стихийных бедствий и природных сил;
                - listitem [ref=f10e97]: — повреждения посторонними предметами, в том числе камнями из-под колес других автомобилей;
                - listitem [ref=f10e98]: — хищение или угон транспортного средства и другие риски.
              - heading "Варианты страхования:" [level=3] [ref=f10e99]
              - generic [ref=f10e100]:
                - generic [ref=f10e101]:
                  - generic [ref=f10e102]: Без учета износа
                  - paragraph [ref=f10e103]: Возмещение ущерба осуществляется без учета износа деталей, подлежащих замене.
                - generic [ref=f10e104]:
                  - generic [ref=f10e105]: Без учета износа по калькуляции
                  - paragraph [ref=f10e106]: Возмещение ущерба осуществляется без учета износа деталей, подлежащих замене.
                  - paragraph [ref=f10e107]: Расчет ущерба производится на основании калькуляции и заключения специалиста по оценке транспортных средств.
                - generic [ref=f10e108]:
                  - generic [ref=f10e109]: С учетом износа
                  - paragraph [ref=f10e110]: Расчет ущерба производится на основании калькуляции стоимости ремонта транспортного средства и заключения о размере вреда.
              - heading "Программа «Оптимальное КАСКО»" [level=3] [ref=f10e111]
              - generic [ref=f10e112]:
                - generic [ref=f10e113]: Специальные условия для автомобилей до 5 лет
                - paragraph [ref=f10e114]: Договор страхования для легковых автомобилей возрастом до 5 лет включительно может быть заключен по программе «Оптимальное КАСКО», в том числе для транспортных средств, приобретенных по договору лизинга либо за счет привлечения банковских средств.
                - generic [ref=f10e115]: Тарифы действуют при наличии и (или) одновременном заключении в ЗАСО «ТАСК» договора добровольного страхования гражданской ответственности владельцев транспортных средств сроком на 1 год.
              - table [ref=f10e117]:
                - rowgroup [ref=f10e118]:
                  - row [ref=f10e119]:
                    - columnheader "Страховая сумма" [ref=f10e120]
                    - columnheader "10 000–15 000 USD" [ref=f10e121]
                    - columnheader "15 000–20 000 USD" [ref=f10e122]
                    - columnheader "20 000–40 000 USD" [ref=f10e123]
                    - columnheader "40 000–60 000 USD" [ref=f10e124]
                    - columnheader "60 000–100 000 USD" [ref=f10e125]
                - rowgroup [ref=f10e126]:
                  - row [ref=f10e127]:
                    - cell "Автомобили до 3 лет" [ref=f10e128]
                    - cell "3,5%" [ref=f10e129]
                    - cell "2,9%" [ref=f10e130]
                    - cell "2,5%" [ref=f10e131]
                    - cell "2,3%" [ref=f10e132]
                    - cell "2,1%" [ref=f10e133]
                  - row [ref=f10e134]:
                    - cell "Автомобили от 4 до 5 лет" [ref=f10e135]
                    - cell "3,5%" [ref=f10e136]
                    - cell "3,2%" [ref=f10e137]
                    - cell "3,2%" [ref=f10e138]
                    - cell "2,8%" [ref=f10e139]
                    - cell "2,8%" [ref=f10e140]
              - generic [ref=f10e141]:
                - paragraph [ref=f10e142]: Для электромобилей и гибридных автомобилей страховой взнос не может быть менее 700 USD либо страховой тариф не может быть менее 3%.
                - paragraph [ref=f10e143]: Условия не распространяются на транспортные средства, используемые в качестве такси, по договорам проката или аренды, а также зарегистрированные за пределами Республики Беларусь.
              - heading "Преимущества полиса КАСКО от ЗАСО «ТАСК»" [level=3] [ref=f10e144]
              - generic [ref=f10e145]:
                - generic [ref=f10e146]:
                  - generic [ref=f10e147]: Гибкие условия
                  - list [ref=f10e148]:
                    - listitem [ref=f10e149]: — гибкие тарифы;
                    - listitem [ref=f10e150]: — бесплатная рассрочка платежа.
                - generic [ref=f10e151]:
                  - generic [ref=f10e152]: Мультидрайв
                  - paragraph [ref=f10e153]: Специальная опция, позволяющая управлять застрахованным автомобилем любому водителю.
                - generic [ref=f10e154]:
                  - generic [ref=f10e155]: Скидки при страховании
                  - list [ref=f10e156]:
                    - listitem [ref=f10e157]: — скидки при наличии договоров по другим видам страхования;
                    - listitem [ref=f10e158]: — скидки при проведении рекламных акций;
                    - listitem [ref=f10e159]: — скидки за безубыточное страхование.
              - heading "Когда можно не обращаться в компетентные органы" [level=3] [ref=f10e160]
              - generic [ref=f10e161]:
                - list [ref=f10e162]:
                  - listitem [ref=f10e163]: — при повреждении только деталей остекления кузова, зеркал и приборов внешнего освещения;
                  - listitem [ref=f10e164]: — при повреждении транспортного средства и (или) дополнительного оборудования, если размер ущерба не превышает 5% от страховой суммы.
                - generic [ref=f10e165]: Возможность применяется не более двух раз за срок действия договора страхования.
              - heading "Перечень необходимых документов" [level=3] [ref=f10e166]
              - list [ref=f10e168]:
                - listitem [ref=f10e169]: — письменное заявление на заключение договора страхования АвтоКАСКО;
                - listitem [ref=f10e170]: — паспорт или иное удостоверение личности;
                - listitem [ref=f10e171]: — регистрационные документы на транспортное средство;
                - listitem [ref=f10e172]: — предъявление транспортного средства представителю страховщика для осмотра.
