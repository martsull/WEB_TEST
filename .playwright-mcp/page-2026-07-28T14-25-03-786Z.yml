            - listitem [ref=f14e82]: Внутреннее страхование ОСГО
          - heading "Внутреннее страхование ОСГО" [level=1] [ref=f14e83]
          - generic [ref=f14e84]:
            - link [ref=f14e86] [cursor=pointer]:
              - /url: https://task.by/electronic_services/
              - img "Онлайн2.png" [ref=f14e87]
            - generic [ref=f14e88]:
              - generic [ref=f14e89]:
                - generic [ref=f14e90]:
                  - generic [ref=f14e91]: Обязательное страхование гражданской ответственности владельцев транспортных средств
                  - paragraph [ref=f14e92]: Обязательное страхование владельцев транспортных средств в Республике Беларусь введено с 1 июля 1999 года.
                  - paragraph [ref=f14e93]: Данный вид страхования предусматривает ответственность за вред, причиненный в результате дорожно-транспортного происшествия жизни, здоровью и имуществу физических и юридических лиц.
                  - generic [ref=f14e94]: В случае ДТП по вине владельца автомобиля гражданская ответственность подразумевает обязанность полностью возместить причиненные третьим лицам убытки.
                - heading "Лимиты ответственности" [level=3] [ref=f14e95]
                - generic [ref=f14e96]:
                  - paragraph [ref=f14e97]: "Лимиты ответственности по обязательному страхованию гражданской ответственности владельцев транспортных средств устанавливаются в следующих размерах:"
                  - list [ref=f14e98]:
                    - listitem [ref=f14e99]: — за вред, причиненный жизни или здоровью потерпевшего — 1150 базовых величин, из них не более 460 базовых величин — на возмещение расходов, связанных с погребением потерпевшего;
                    - listitem [ref=f14e100]: — за вред, причиненный имуществу потерпевших — 1150 базовых величин;
                    - listitem [ref=f14e101]: — за вред транспортному средству, застрахованному по договору комплексного внутреннего страхования — 1150 базовых величин.
                - heading "Страховые тарифы" [level=3] [ref=f14e102]
                - generic [ref=f14e103]:
                  - paragraph [ref=f14e104]: Размеры страховых тарифов устанавливаются Правительством Республики Беларусь по согласованию с Президентом Республики Беларусь и являются едиными для всех страховых организаций.
                  - generic [ref=f14e105]: "На размер страхового взноса влияют: тип транспортного средства, объем двигателя, срок действия полиса, место регистрации, стаж водителя, а также наличие либо отсутствие аварий за предыдущий период страхования."
                - heading "Срок действия договора" [level=3] [ref=f14e106]
                - generic [ref=f14e107]:
                  - paragraph [ref=f14e108]: Договор внутреннего страхования, договор союзного страхования и договор международного страхования могут заключаться на срок от 15 дней до 12 месяцев.
                  - paragraph [ref=f14e109]: Договор пограничного страхования заключается на срок от 5 дней до 12 месяцев.
                  - generic [ref=f14e110]: При приобретении либо получении транспортного средства до его регистрации собственник обязан заключить договор внутреннего или союзного страхования сроком на 15 дней.
                - heading "Важно знать при продаже автомобиля" [level=3] [ref=f14e111]
                - generic [ref=f14e112]:
                  - paragraph [ref=f14e113]: Если прежний собственник транспортного средства передал договор внутреннего страхования новому владельцу, такой договор прекращает свое действие с момента отчуждения транспортного средства.
                  - generic [ref=f14e114]:
                    - text: "Владелец отчужденного транспортного средства имеет право:"
                    - list [ref=f14e115]:
                      - listitem [ref=f14e116]: — на возврат части страхового взноса;
                      - listitem [ref=f14e117]: — на переоформление договора страхования на другое приобретенное транспортное средство.
                - heading "Перечень документов для заключения договора" [level=3] [ref=f14e118]
                - list [ref=f14e120]:
                  - listitem [ref=f14e121]: — письменное заявление о заключении внутреннего договора ОСГО;
                  - listitem [ref=f14e122]: — паспорт или иной документ, удостоверяющий личность;
                  - listitem [ref=f14e123]: — технический паспорт либо иной документ, подтверждающий право владения транспортным средством.
                - heading "Ответственность за отсутствие страхования" [level=3] [ref=f14e124]
                - generic [ref=f14e125]:
                  - paragraph [ref=f14e126]: "Согласно статье 18.20 Кодекса Республики Беларусь об административных правонарушениях:"
                  - generic [ref=f14e127]:
                    - text: "Эксплуатация транспортного средства без заключения договора обязательного страхования гражданской ответственности владельцев транспортных средств влечет наложение штрафа:"
                    - list [ref=f14e128]:
                      - listitem [ref=f14e129]: — на физическое лицо — до 5 базовых величин;
                      - listitem [ref=f14e130]: — на индивидуального предпринимателя или юридическое лицо — до 15 базовых величин.
