            - listitem [ref=f21e90]: Отпуск, животные и страховка
          - heading "Отпуск, животные и страховка" [level=1] [ref=f21e91]
          - generic [ref=f21e92]:
            - generic [ref=f21e93]:
              - time [ref=f21e96]: 26 июня 2026
              - img "Отпуск, животные и страховка" [ref=f21e98]
              - generic [ref=f21e100]:
                - 'heading "Животные в отпуске: будьте осторожны" [level=2] [ref=f21e101]'
                - generic [ref=f21e102]:
                  - strong [ref=f21e103]: Укус животного за границей может обойтись очень дорого.
                  - text: В путешествии даже милая встреча с кошкой, собакой или другим животным может закончиться визитом к врачу.
                - paragraph [ref=f21e104]: В отпуске легко потерять осторожность. Милый кот у отеля, собака возле кафе, щенок на пляже или обезьяна в туристическом месте кажутся частью приятной отпускной атмосферы. Хочется подойти ближе, погладить, покормить с руки или сделать красивое фото.
                - paragraph [ref=f21e105]: Но за такой случайной встречей может скрываться серьёзный риск. Даже небольшой укус, царапина или попадание слюны животного на повреждённую кожу — это повод не ждать, а сразу обращаться за медицинской помощью.
                - heading "Почему это важно" [level=3] [ref=f21e106]
                - paragraph [ref=f21e107]: "Один из самых опасных рисков после контакта с животными — бешенство. Это заболевание требует срочных действий: промывания раны, осмотра врача и решения вопроса о профилактических прививках."
                - paragraph [ref=f21e108]: Проблема в том, что внешне животное не всегда выглядит больным или опасным. Оно может спокойно сидеть возле кафе, подходить к людям, брать еду из рук и всё равно представлять угрозу. Особенно рискованны ситуации, когда животное испугалось, защищает территорию или еду, находится рядом с детёнышами либо привыкло к постоянному вниманию туристов.
                - generic [ref=f21e109]:
                  - strong [ref=f21e110]: "Главное правило:"
                  - text: за границей лучше не гладить, не кормить с рук и не брать на руки незнакомых животных, даже если они выглядят дружелюбными.
                - heading "Что делать при укусе или царапине" [level=3] [ref=f21e111]
                - paragraph [ref=f21e112]: Если животное укусило, поцарапало повреждённую кожу, действовать нужно сразу.
                - paragraph [ref=f21e113]: Тщательно промойте место контакта водой с мылом. Если есть рана, после промывания обработайте её перекисью водорода, края раны — спиртосодержащим антисептиком, наложите стерильную повязку.
                - generic [ref=f21e114]:
                  - strong [ref=f21e115]: "Важно:"
                  - text: после укуса, царапины или ослюнения необходимо немедленно обратиться к врачу. Не стоит ждать, пока рана «подсохнет», «перестанет болеть» или «само пройдёт».
                - paragraph [ref=f21e116]: Решение о вакцинации, сроках прививок и необходимости дополнительных препаратов принимает медицинский специалист.
                - generic [ref=f21e117]:
                  - heading "Сколько может стоить лечение" [level=3] [ref=f21e118]
                  - paragraph [ref=f21e119]: "Медицинская помощь за границей часто обходится значительно дороже, чем турист ожидает. После укуса или царапины может потребоваться не один визит, а целый курс обращений: первичный осмотр, обработка раны, вакцинация, повторные прививки, консультации, а в отдельных случаях — введение антирабического иммуноглобулина."
                  - generic [ref=f21e120]:
                    - generic [ref=f21e121]:
                      - generic [ref=f21e122]: Первичный визит к врачу
                      - generic [ref=f21e123]: 150–200 USD
                    - generic [ref=f21e124]:
                      - generic [ref=f21e125]: Каждая последующая прививка
                      - generic [ref=f21e126]: 50–100 USD
                    - generic [ref=f21e127]:
                      - generic [ref=f21e128]: Курс прививок может включать обращения на 3-й, 7-й, 14-й, 30-й и 90-й день
                      - generic [ref=f21e129]: по назначению врача
                    - generic [ref=f21e130]:
                      - generic [ref=f21e131]: Антирабический иммуноглобулин в отдельных случаях
                      - generic [ref=f21e132]: около 5 000 USD
                - paragraph [ref=f21e133]: В итоге даже небольшая царапина может превратиться в серьёзные расходы. И это только медицинская часть. К ней могут добавиться такси до клиники, звонки в ассистанс, перевод документов, изменение планов поездки и стресс из-за необходимости разбираться в чужой стране.
                - heading "Как помогает страховка" [level=3] [ref=f21e134]
                - paragraph [ref=f21e135]: Страховой полис для выезжающих за рубеж — это не просто формальность перед поездкой. В непредвиденной ситуации он помогает быстрее понять, куда обращаться, как организовать медицинскую помощь и какие расходы могут быть покрыты по условиям договора.
                - paragraph [ref=f21e136]: Если произошёл укус, травма, внезапное заболевание или другой несчастный случай, туристу не приходится оставаться один на один с проблемой. Можно связаться с ассистансом, получить рекомендации по дальнейшим действиям и обратиться за помощью в медицинское учреждение.
                - paragraph [ref=f21e137]: "Страховка особенно важна именно в таких ситуациях: когда решение нужно принимать быстро, а цена ошибки может быть высокой."
                - generic [ref=f21e138]:
                  - heading "Простые правила в поездке" [level=3] [ref=f21e139]
                  - generic [ref=f21e140]: не гладьте незнакомых животных;
                  - generic [ref=f21e141]: не кормите собак, кошек и обезьян с рук;
                  - generic [ref=f21e142]: не подходите близко к животным с детёнышами;
                  - generic [ref=f21e143]: не разрешайте детям играть с уличными животными;
                  - generic [ref=f21e144]: не пытайтесь сфотографироваться слишком близко с дикими или бездомными животными;
                  - generic [ref=f21e145]: при укусе, царапине сразу промойте место контакта и обратитесь к врачу.
                - generic [ref=f21e146]:
                  - paragraph [ref=f21e147]: Отпуск должен оставаться временем приятных впечатлений, а не срочных визитов в иностранную клинику.
                  - paragraph [ref=f21e148]: Оформите страховой полис для выезжающих за рубеж заранее — и путешествуйте спокойнее.
                  - link "Оформить страховку онлайн" [ref=f21e149] [cursor=pointer]:
                    - /url: https://task.by/electronic_services/
